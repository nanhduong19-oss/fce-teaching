<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>FCE Word Formation · Tier 1 Interactive Classroom</title><style>
    :root{
      --pistachio:#CEF26D;
      --pistachio-soft:#F2F9DA;
      --frost:#F3F6FF;
      --denim:#3770BF;
      --denim-soft:#DCEBFF;
      --ink:#15365A;
      --muted:#5E7590;
      --paper:#FFFFFF;
      --bg:#F7FAFF;
      --line:#C7D7EC;
      --danger:#D45A54;
      --danger-soft:#FCE7E4;
      --success:#4E7D16;
      --success-soft:#F1F8DF;
      --shadow:0 18px 55px rgba(38,83,117,.13);
      --radius:26px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Google Sans","Google Sans Text","Product Sans",Arial,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    .app{min-height:100vh;display:flex;flex-direction:column}

    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      padding:14px 24px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line)
    }
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .mark{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,var(--pistachio),#e0f795);display:grid;place-items:center;font-weight:800;font-size:23px;color:#33400e;box-shadow:0 8px 20px rgba(113,126,35,.18)}
    .brandtext{font-weight:800;letter-spacing:-.02em;font-size:18px;line-height:1.2}
    .brandtext small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
    .topactions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

    .btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:11px 15px;font-weight:700;font-size:14px;transition:.18s ease}
    .btn:hover{transform:translateY(-1px);border-color:var(--denim)}
    .btn.primary{background:var(--denim);border-color:var(--denim);color:#fff}
    .btn.pistachio{background:var(--pistachio);border-color:var(--pistachio);color:#29340d}
    .btn.ghost{background:transparent}
    .btn.danger{background:var(--danger-soft);border-color:#efb7b2;color:#7f2d29}
    .btn.big{padding:15px 22px;font-size:18px;border-radius:18px}

    .shell{width:min(1560px,96vw);margin:0 auto;flex:1;padding:28px 0 52px}
    .hero{display:grid;grid-template-columns:1.45fr .55fr;gap:24px;align-items:stretch}
    .hero-main,.hero-side{border-radius:32px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
    .hero-main{background:linear-gradient(145deg,var(--frost),#ffffff);padding:34px 36px}
    .hero-side{background:linear-gradient(145deg,var(--pistachio),#e2f8a0);padding:30px;color:#243807;display:flex;flex-direction:column;justify-content:space-between}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--denim)}
    .hero-side .eyebrow{color:#52600e}
    h1{font-size:clamp(38px,5.4vw,76px);line-height:.99;letter-spacing:-.055em;margin:14px 0 18px;max-width:1050px}
    .lead{font-size:20px;line-height:1.55;color:var(--muted);max-width:920px}
    .hero-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:99px;background:white;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink)}
    .hero-side .bigstat{font-size:48px;font-weight:800;letter-spacing:-.06em;line-height:1}
    .hero-side .smallcopy{font-size:16px;line-height:1.5;margin-top:8px}

    .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 16px}
    .section-title{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0}
    .section-sub{font-size:15px;color:var(--muted);margin-top:6px}
    .filterbar{display:flex;gap:8px;flex-wrap:wrap}
    .filter{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:800;color:var(--muted)}
    .filter.active{background:var(--denim);border-color:var(--denim);color:white}

    .tiergrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
    .tiercard{position:relative;min-height:190px;text-align:left;border:1.5px solid var(--line);border-radius:26px;background:white;padding:22px;box-shadow:0 12px 34px rgba(42,83,112,.08);overflow:hidden;transition:.2s ease}
    .tiercard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .tiercard::after{content:"";position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:var(--frost);opacity:.9}
    .tiercard.t1{border-top:7px solid var(--pistachio)}
    .tiercard.t2{border-top:7px solid #9FAE3B}
    .tiercard.t3{border-top:7px solid #86B9E5}
    .tiercard.t4{border-top:7px solid var(--denim)}
    .tiercard.mix{border-top:7px solid #7A76C8}
    .tier-kicker{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
    .tier-name{font-size:25px;line-height:1.12;font-weight:800;margin:10px 0 8px;letter-spacing:-.03em}
    .tier-meta{font-size:14px;line-height:1.5;color:var(--muted)}
    .tier-count{margin-top:22px;font-size:13px;font-weight:800;color:var(--denim)}

    .practicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .practicecard{border:1.5px solid var(--line);background:white;border-radius:22px;padding:20px;text-align:left;transition:.18s ease;min-height:150px}
    .practicecard:hover{border-color:var(--denim);transform:translateY(-2px)}
    .practice-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .badge{font-size:12px;font-weight:800;border-radius:999px;padding:7px 10px;background:var(--frost);color:var(--denim)}
    .practice-title{font-size:20px;font-weight:800;line-height:1.25;margin:16px 0 7px}
    .practice-desc{font-size:14px;color:var(--muted);line-height:1.45}
    .practice-progress{margin-top:16px;height:7px;border-radius:10px;background:#edf3f8;overflow:hidden}
    .practice-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pistachio),#bde44d);width:0}

    .classroom-toolbar{position:sticky;top:75px;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:10px 14px;background:rgba(243,246,255,.98);backdrop-filter:blur(14px);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 8px 22px rgba(30,65,106,.10)}
    .lefttools,.righttools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .modepill{display:inline-flex;align-items:center;gap:8px;background:var(--pistachio);color:#2f3b0e;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800}
    .qnav{display:flex;gap:7px;flex-wrap:wrap}
    .qdot{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--ink)}
    .qdot.active{background:var(--denim);border-color:var(--denim);color:#fff;box-shadow:0 8px 18px rgba(55,112,191,.18)}
    .qdot.revealed{background:var(--success-soft);border-color:#c9d99d;color:#4d6d2d}

    .classroom{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.5fr);gap:18px;align-items:start}
    .panel{background:#fff;border:1.5px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
    .passage-panel{padding:30px 34px}
    .side-panel{padding:24px;position:sticky;top:178px}
    .practice-heading{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:4px 0 8px}
    .practice-meta{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:24px}

    .passage{font-size:30px;line-height:1.75;letter-spacing:-.012em;font-weight:500}
    .passage p{margin:0 0 1.15em}
    .gap{display:inline-flex;align-items:center;gap:10px;white-space:normal;flex-wrap:wrap;border-radius:12px;padding:0 8px;background:var(--frost);color:#2d6eaa;font-weight:800;border:2px solid transparent;transition:.16s ease;vertical-align:baseline}
    .gap:hover{border-color:var(--denim);background:#f2f8fd}
    .gap.active{background:#e4f0ff;border-color:var(--denim);box-shadow:0 0 0 3px rgba(55,112,191,.14)}
    .gap.revealed{background:var(--success-soft);color:var(--success);border-color:#cde39f}
    .gap .base{font-size:30px;line-height:1.25;letter-spacing:.015em;color:#234e7b;border-left:2px solid #9ebcda;padding-left:10px;font-weight:850}
    .gap.revealed .base{color:#728544}

    .side-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--denim)}
    .question-no{font-size:18px;font-weight:800;margin-top:10px;color:var(--muted)}
    .focus-sentence{font-size:30px;line-height:1.55;font-weight:650;margin:14px 0 20px;letter-spacing:-.02em}
    .baseword{min-width:0;background:var(--frost);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .baseword small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:5px}
    .baseword strong{font-size:clamp(22px,2vw,28px);letter-spacing:.05em;word-break:break-word;overflow-wrap:anywhere}
    .posbadge{font-size:13px;font-weight:800;background:white;border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--denim)}
    .answerbox{border:2px dashed #b9ccdb;border-radius:19px;min-height:108px;display:grid;place-items:center;padding:16px;text-align:center;background:#fbfdff;margin-bottom:14px}
    .answerbox .hidden-answer{font-size:17px;color:var(--muted);font-weight:700}
    .answerbox .answer{font-size:clamp(24px,2.2vw,35px);font-weight:800;color:var(--success);letter-spacing:-.03em;line-height:1.15;max-width:100%;word-break:break-word;overflow-wrap:anywhere;white-space:normal;display:block}
    .formation{margin-top:14px;background:var(--pistachio-soft);border:1px solid #d7dfa0;border-radius:18px;padding:15px;display:none}
    .formation.show{display:block}
    .formation-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px;font-weight:750;line-height:1.45}
    .step{background:#fff;border:1px solid #d9e0aa;padding:7px 9px;border-radius:11px;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
    .arrow{color:#748126}
    .note{font-size:22px;line-height:1.55;color:#334727;margin-top:14px;font-weight:550;overflow-wrap:anywhere}
    .side-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
    .side-actions .btn:first-child{grid-column:1/-1}
    .hintline{font-size:17px;color:var(--muted);line-height:1.55;margin-top:14px}

    .review-panel{padding:30px}
    .review-title{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:0 0 8px}
    .review-sub{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:20px}
    .reviewgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .reviewitem{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:17px;text-align:left}
    .reviewitem:hover{border-color:var(--denim)}
    .reviewitem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .reviewitem strong{font-size:19px}
    .reviewitem small{display:block;color:var(--muted);font-size:13px;margin-top:7px;line-height:1.45}
    .answer-pill{font-weight:800;color:var(--success);background:var(--success-soft);padding:7px 10px;border-radius:999px;font-size:13px;max-width:100%;white-space:normal;word-break:break-word}

    .empty{border:1.5px dashed var(--line);border-radius:22px;padding:30px;text-align:center;color:var(--muted);background:#fff}

    .modalback{position:fixed;inset:0;background:rgba(22,45,63,.53);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
    .modal{width:min(760px,96vw);max-height:88vh;overflow:auto;border-radius:28px;background:white;border:1px solid var(--line);box-shadow:0 30px 90px rgba(12,41,61,.28);padding:28px}
    .modal h2{font-size:30px;letter-spacing:-.035em;margin:0 0 8px}
    .modal p{font-size:15px;color:var(--muted);line-height:1.55}
    .fieldlabel{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin:18px 0 7px;color:var(--muted)}
    .urlinput{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;font-size:15px;color:var(--ink);outline:none}
    .urlinput:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(87,152,215,.13)}
    .statusbox{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--frost);font-size:13px;color:var(--muted);line-height:1.45}
    .modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
    .schema{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#f6f9fb;border:1px solid var(--line);border-radius:16px;padding:14px;color:#395166}

    .footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 24px 28px}

    @media (max-width:1200px){
      .tiergrid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .practicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .classroom{grid-template-columns:1fr}
      .side-panel{position:static}
    }
    @media (max-width:820px){
      .practicegrid{grid-template-columns:1fr}
      .baseword{align-items:flex-start;flex-direction:column}
      .shell{width:94vw;padding-top:18px}
      .hero{grid-template-columns:1fr}
      .tiergrid{grid-template-columns:1fr 1fr}
      .practicegrid{grid-template-columns:1fr}
      .passage-panel{padding:22px}
      .passage,.focus-sentence{font-size:clamp(23px,5vw,30px)}
      .topbar{padding:12px 14px}
      .brandtext small{display:none}
      .reviewgrid{grid-template-columns:1fr}
    }
    @media (max-width:560px){
      .tiergrid{grid-template-columns:1fr}
      .hero-main,.hero-side{padding:24px}
      .side-actions{grid-template-columns:1fr}
      .side-actions .btn:first-child{grid-column:auto}
    }
    @media print{.topbar,.footer,.classroom-toolbar,.side-panel{display:none!important}.shell{width:100%;padding:0}.panel{border:0;box-shadow:none}.passage{font-size:18pt}}
  
.tiercard:disabled{opacity:.68;cursor:default}.topic-label{display:none}.instructions{font-size:17px;line-height:1.55;background:var(--frost);border-radius:16px;padding:14px 18px;margin:14px 0 22px;color:var(--ink)}.number-base{display:inline-flex;vertical-align:middle;align-items:center;gap:6px}.gap{font-family:inherit;font-size:inherit}.gap .base{font-size:30px;line-height:1.25;font-weight:850;color:#193f72;letter-spacing:0;white-space:normal;overflow-wrap:anywhere}.example{background:var(--pistachio-soft);color:#3e5220;border-radius:10px;padding:2px 7px;font-weight:800}.examplebase{font-size:28px;color:#607636;font-weight:800;white-space:nowrap}.focus-sentence{font-size:25px}.side-panel{max-height:calc(100vh - 190px);overflow:auto}.passage-panel{min-width:0}.passage{overflow-wrap:break-word}.status-muted{font-size:13px;color:var(--muted);padding:7px}.formcontrols{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.hidden-explanations{font-size:20px;line-height:1.5;color:var(--muted);padding:10px;border-radius:12px;background:var(--frost)}.source-url{word-break:break-all}.reviewitem{text-align:left}.practicecard:focus-visible,.gap:focus-visible,.qdot:focus-visible,.btn:focus-visible{outline:3px solid var(--denim);outline-offset:3px}.section-note{font-size:14px;color:var(--muted)}.help-tag{font-size:12px;font-weight:700;color:var(--muted)}
@media(max-width:1200px){.side-panel{max-height:none}}

/* Classroom countdown – 6 minutes per practice */
.timer-widget{display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid #c7d7ec;border-radius:16px;background:#f3f6ff;flex-wrap:wrap}
.timer-readout{font-size:34px;line-height:1;font-weight:850;color:#15365a;font-variant-numeric:tabular-nums;min-width:77px;text-align:center}
.timer-widget.warning{background:#fff5da;border-color:#e1b85c}.timer-widget.warning .timer-readout{color:#985c08}
.timer-widget.finished{background:#ffe6e4;border-color:#e59b96}.timer-widget.finished .timer-readout{color:#b42f27}
.timer-widget .timer-name{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#57738e}
.timer-widget .timer-btn{font:inherit;font-size:16px;font-weight:750;padding:8px 11px;border:1px solid #b6cae0;border-radius:10px;background:white;color:#15365a;cursor:pointer}
.timer-widget .timer-btn.start{background:#cef26d;border-color:#cef26d;color:#173516}
.timer-widget .timer-btn:disabled{opacity:.5;cursor:not-allowed}
.timer-timeup[hidden]{display:none}.timer-timeup{background:#fff1ef;border:2px solid #db8e85;border-radius:15px;padding:12px 18px;color:#982d27;font-weight:800;margin-bottom:16px;text-align:center}
@media(max-width:760px){.timer-widget{width:100%;justify-content:center}.timer-readout{font-size:29px}.classroom-toolbar{top:68px;padding:10px}.note{font-size:21px}}

    /* Classroom: base word large before reveal, compact after answer is shown. */
    .gap.revealed .base{font-size:20px;line-height:1.3;}

function timerMarkup(){const cls=timer.finished?'finished':timer.remaining<=60?'warning':'';return `<div class="timer-widget ${cls}" aria-label="6 minute practice countdown"><span class="timer-name">⏱ Time</span><strong class="timer-readout" id="timerReadout" role="timer">${timerText()}</strong><button class="timer-btn start" id="timerToggle" onclick="toggleTimer()">${timer.running?'Pause':timer.finished?'Restart':'Start'}</button><button class="timer-btn" onclick="resetTimer()">↺ Reset</button></div>`}

function topbar(){return `<header class="topbar"><div class="brand"><div class="mark">W</div><div class="brandtext">FCE WORD FORMATION<small>Interactive classroom · Part 3</small></div></div><div class="topactions"><button class="btn" onclick="goHome()">⌂ Library</button>${state.page==='practice'?'<button class="btn" onclick="toggleReview()">Review</button>':''}<button class="btn" onclick="openSource()">↗ GitHub data</button><button class="btn primary" onclick="toggleFull()">⛶ Fullscreen</button></div></header>`}
function render(){document.getElementById('app').innerHTML=topbar()+`<main class="shell">${state.page==='home'?homeHTML():practiceHTML()}</main><footer class="footer">Tier 1 · FCE Reading & Use of English Part 3 · Google Sans 30 px · Answers hidden until teacher reveals · ${esc(state.status)}</footer>`+(state.modal?sourceModal():'');}
function homeHTML(){let cards=TIERS.map(t=>{let count=tierCount(t.id);return `<button class="tiercard ${t.accent}" onclick="selectTier(${t.id==='mixed'?"'mixed'":t.id})" ${!count?'disabled':''}><div class="tier-kicker">${t.id==='mixed'?'CUMULATIVE':`TIER ${t.id}`}</div><div class="tier-name">${esc(t.name)}</div><div class="tier-meta">${count?count+' practices available':'Coming soon'}</div><div class="tier-count">${count?'Explore →':'More practice sets will appear here'}</div></button>`}).join('');let selected=byTier().slice().sort((a,b)=>(a.practice||0)-(b.practice||0));let practiceCards=`<div class="practicegrid">${selected.map(p=>{let rev=Object.keys(pstate(p.id).revealed).length;return `<button class="practicecard" onclick="openPractice('${esc(p.id)}')"><div class="practice-top"><span class="badge">PRACTICE ${String(p.practice).padStart(2,'0')}</span><span class="help-tag">${rev}/8 revealed</span></div><div class="practice-title">${esc(p.title)}</div><div class="practice-desc">Part 3 · Questions 17–24 · ${esc(p.topic)}</div><div class="practice-progress"><span style="width:${100*rev/8}%"></span></div></button>`}).join('')}</div>`;return `<div class="hero"><div class="hero-main"><div class="eyebrow">FCE Reading & Use of English · Part 3</div><h1>Word Formation<br>Classroom Library</h1><div class="lead">Select a practice, read the passage together, then click a gap to reveal and explain each word form. Answers are hidden until you choose to show them.</div><div class="hero-chips"><span class="chip">10 Tier 1 Practices</span><span class="chip">80 questions</span><span class="chip">Teacher-controlled reveal</span></div></div><div class="hero-side"><div class="eyebrow">Current collection</div><div><div class="bigstat">10</div><div class="smallcopy">Tier 1 lessons ready for offline projection.</div></div></div></div><div class="section-head"><div><h2 class="section-title">Explore by tier</h2><div class="section-sub">Future tiers will be populated by your GitHub JSON source.</div></div></div><div class="tiergrid">${cards}</div><div class="section-head"><div><h2 class="section-title">${state.tier==='mixed'?'Mixed Practices':'Tier '+state.tier+' · Practices'}</h2><div class="section-sub">All practice cards are shown in one list for quicker access.</div></div></div>${selected.length?practiceCards:'<div class="empty">No practices in this tier yet.</div>'}`}
function itemAt(p,n){return p.items.find(x=>x.number===n)}
function paragraphMarkup(p,text){const tokens=text.split(/(\(\d+\)\s*\{\{\d+\}\})/g);return tokens.map(chunk=>{let m=chunk.match(/^\((\d+)\)\s*\{\{(\d+)\}\}$/);if(!m)return esc(chunk);let n=Number(m[1]);if(n===0)return `<span class="example">(0) ${esc(p.example.answer)}</span> <span class="examplebase">${esc(p.example.base_word)}</span>`;let it=itemAt(p,n),show=pstate(p.id).revealed[n];if(!it)return esc(chunk);return `<button class="gap ${state.q===n&&!state.review?'active':''} ${show?'revealed':''}" onclick="goQ(${n})" aria-label="Question ${n}, base word ${esc(it.base_word)}"><span>(${n}) ${show?esc(it.answer):'________'}</span><span class="base">${esc(it.base_word)}</span></button>`}).join('')}
function focusedSentence(p,n){let paragraphs=p.passage.split(/\n\s*\n/);let hit=paragraphs.find(z=>z.includes('('+n+') {{'+n+'}}'))||'';return paragraphMarkup(p,hit)}
function passageHTML(p){return p.passage.split(/\n\s*\n/).map(z=>`<p>${paragraphMarkup(p,z)}</p>`).join('')}
function practiceHTML(){let p=current();if(!p)return '<div class="empty">Practice not found. Return to Library.</div>';let ps=pstate(p.id);let nav=p.items.map(it=>`<button class="qdot ${state.q===it.number&&!state.review?'active':''} ${ps.revealed[it.number]?'revealed':''}" onclick="goQ(${it.number})">${it.number}</button>`).join('');let position=DATA.practices.findIndex(x=>x.id===p.id),next=DATA.practices[position+1];return `<div class="classroom-toolbar"><div class="lefttools"><span class="modepill">TIER ${p.tier} · PRACTICE ${String(p.practice).padStart(2,'0')}</span><button class="btn" onclick="goHome()">← All practices</button></div><div class="righttools">${timerMarkup()}<div class="qnav">${nav}</div></div></div><div id="timeupNotice" class="timer-timeup" ${timer.finished?'':'hidden'}>⏰ Time is up! 6 minutes completed.</div>${state.review?reviewHTML(p,next):`<div class="classroom"><section class="panel passage-panel"><div class="eyebrow">READING & USE OF ENGLISH · PART 3</div><h1 class="practice-heading">${esc(p.title)}</h1><div class="practice-meta">Master Topic ${p.master_topic} · ${esc(p.topic)} · 8 questions (17–24)</div><div class="instructions">For questions <b>17–24</b>, use the word given in capitals to form a word that fits each gap. There is an example at the beginning (0). Write your answers <b>IN CAPITAL LETTERS</b>.</div><div class="passage">${passageHTML(p)}</div><div class="formcontrols"><button class="btn" onclick="resetPractice()">↺ Hide all answers</button><button class="btn" onclick="toggleReview()">View review →</button></div></section>${sideHTML(p,itemAt(p,state.q))}</div>`}`}
function sideHTML(p,it){let revealed=!!pstate(p.id).revealed[it.number];let n=it.number;return `<aside class="panel side-panel"><div class="side-title">TEACHER CORRECTION PANEL</div><div class="question-no">QUESTION ${n} / 24</div><div class="focus-sentence">${focusedSentence(p,n)}</div><div class="baseword"><div><small>BASE WORD</small><strong>${esc(it.base_word)}</strong></div>${revealed?`<span class="posbadge">${esc(it.word_class)}</span>`:'<span class="posbadge">Part 3</span>'}</div><div class="answerbox">${revealed?`<span class="answer">${esc(it.answer)}</span>`:'<span class="hidden-answer">Answer hidden · Ask your students first</span>'}</div><button class="btn ${revealed?'ghost':'pistachio'} big" style="width:100%" onclick="toggleReveal(${n})">${revealed?'Hide answer':'Reveal answer →'}</button>${revealed?`<div class="formation show"><div class="side-title">WORD FORMATION</div><div class="formation-row">${esc(it.formation_path).split(' → ').map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="step">${x}</span>`).join('')}</div><div class="note">${esc(it.explanation)}</div></div><div class="hintline">${it.answer_provenance==='source_provided'?'Answer supplied in original handout':'Answer inferred and reviewed for QC v2'}</div>`:'<div class="hidden-explanations">Word class, answer and teaching explanation stay hidden until you reveal them.</div>'}<div class="side-actions"><button class="btn" onclick="prevQ()" ${n===17?'disabled':''}>← Previous</button><button class="btn" onclick="nextQ()" ${n===24?'disabled':''}>Next →</button></div><div class="hintline">Teacher shortcuts: ← / → navigate · Space reveal · R review · Esc close.</div></aside>`}
function reviewHTML(p,next){let total=Object.keys(pstate(p.id).revealed).length;return `<section class="panel review-panel"><div class="eyebrow">TEACHER KEY · RECAP</div><h2 class="review-title">${esc(p.title)}</h2><div class="review-sub">${total}/8 revealed in passage · Review mode displays all eight answers. Return to the passage at any question.</div><div class="reviewgrid">${p.items.map(it=>`<button class="reviewitem" onclick="goQ(${it.number})"><div class="reviewitem-top"><strong>Q${it.number} · ${esc(it.base_word)}</strong><span class="answer-pill">${esc(it.answer)}</span></div><small>${esc(it.word_class)} · ${esc(it.formation_path)}</small></button>`).join('')}</div><div class="formcontrols"><button class="btn" onclick="toggleReview()">← Back to passage</button>${next?`<button class="btn primary" onclick="openPractice('${esc(next.id)}')">Next practice →</button>`:'<button class="btn primary" onclick="goHome()">Library →</button>'}</div></section>`}
function selectTier(t){state.tier=t;render()}
function openPractice(id){if(timer.practice!==id){timer.practice=id;resetTimer()}state.page='practice';state.practice=id;state.q=17;state.review=false;render();scrollTo({top:0,behavior:'instant'})}
function goHome(){timer.running=false;state.page='home';state.review=false;render();scrollTo({top:0,behavior:'instant'})}
function goQ(n){state.q=n;state.review=false;render()}
function prevQ(){state.q=Math.max(17,state.q-1);render()}
function nextQ(){state.q=Math.min(24,state.q+1);render()}
function toggleReveal(n){let p=current();let r=pstate(p.id).revealed;r[n]=!r[n];if(!r[n])delete r[n];save();render()}
function resetPractice(){let p=current();if(confirm('Hide all answers in this practice?')){pstate(p.id).revealed={};save();render()}}
function toggleReview(){state.review=!state.review;render()}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function openSource(){state.modal=true;render()}
function closeSource(){state.modal=false;render()}
function sourceModal(){let url=localStorage.getItem(SOURCE)||'';return `<div class="modalback" onclick="closeSource()"><div class="modal" onclick="event.stopPropagation()"><h2>GitHub · Collections</h2><p>10 Tier 1 practices are embedded as an offline backup. On GitHub Pages this site automatically reads data/manifest.json. To use another repository, paste its public HTTPS manifest.json URL here. Local HTML opens with the built-in Tier 1 backup.</p><div class="fieldlabel">Public GitHub manifest.json or JSON URL</div><input id="sourceUrl" class="urlinput" placeholder="https://raw.githubusercontent.com/OWNER/REPO/main/data/manifest.json" value="${esc(url)}"><div id="sourceStatus" class="statusbox">${esc(state.status)}</div><div class="modal-actions"><button class="btn" onclick="restoreOffline()">Use offline Tier 1</button><button class="btn primary" onclick="loadRemote()">Load collection</button><button class="btn ghost" onclick="closeSource()">Close</button></div><p>Expected structure: <code>{ "practices": [ { "id", "tier", "practice", "title", "passage", "example", "items" } ] }</code> using placeholders <code>(17) {{17}}</code> ... <code>(24) {{24}}</code>.</p></div></div>`}
function validatePayload(x){let ps=Array.isArray(x)?x:x?.practices;if(!Array.isArray(ps)||!ps.length)throw Error('Missing practices array.');const ids=new Set();for(let p of ps){if(!p.id||ids.has(p.id)||typeof p.passage!=='string'||!p.example||!Array.isArray(p.items)||p.items.length!==8)throw Error('Invalid practice schema or duplicate ID '+p.id);ids.add(p.id);for(let n=17;n<=24;n++){let it=p.items.find(i=>i.number===n);if(!it||!it.base_word||!it.answer||!p.passage.includes('('+n+') {{'+n+'}}'))throw Error('Missing gap or answer '+p.id+' Q'+n)} }return ps}
async function fetchJSON(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status+' · '+url);return response.json()}
async function resolveCollections(source,base){
  if(!Array.isArray(source.collections))return validatePayload(source);
  const list=source.collections.filter(c=>c.enabled!==false);
  if(!list.length)throw Error('No enabled collections in manifest.');
  const all=[];
  for(const entry of list){
    if(typeof entry.path!=='string'||!entry.path.trim())throw Error('Collection missing path');
    const url=new URL(entry.path,base).href;
    const collection=await fetchJSON(url);
    const records=validatePayload(collection);
    for(const record of records){
      if(entry.tier!==undefined&&record.tier!==entry.tier)throw Error('Tier mismatch in '+entry.path);
      all.push(record);
    }
  }
  validatePayload({practices:all});
  return all;
}
async function loadCatalog(url){
  const doc=await fetchJSON(url);
  const ps=await resolveCollections(doc,url);
  return {schema_version:'1.1',practices:ps};
}
async function loadRemote(){
  const url=document.getElementById('sourceUrl').value.trim();
  const status=document.getElementById('sourceStatus');
  if(!/^https:\/\//i.test(url)){status.textContent='Enter a public HTTPS JSON or manifest URL.';return;}
  status.textContent='Loading and validating collections...';
  try{
    const catalog=await loadCatalog(url);
    DATA=catalog;localStorage.setItem(SOURCE,url);
    state.status='GitHub: '+catalog.practices.length+' practices';state.source='remote';
    state.modal=false;state.page='home';state.tier=1;render();
  }catch(e){status.textContent='Unable to load: '+e.message+' · Current lessons were not replaced.';}
}
function restoreOffline(){DATA=BUILTIN;localStorage.removeItem(SOURCE);state.source='offline';state.status='10 offline practices ready';state.tier=1;state.page='home';state.modal=false;render()}
async function autoLoad(){
  const saved=localStorage.getItem(SOURCE);
  const url=saved||new URL('data/manifest.json',location.href).href;
  if(location.protocol==='file:'&&!saved){state.status='Offline · 10 Tier 1 practices';render();return;}
  try{
    const catalog=await loadCatalog(url);
    DATA=catalog;state.source=saved?'remote':'site';
    state.status=(saved?'Custom GitHub':'GitHub Pages')+' · '+catalog.practices.length+' practices';
    if(!DATA.practices.some(p=>p.tier===state.tier))state.tier=DATA.practices[0].tier;
  }catch(e){state.status='Offline backup · remote data unavailable ('+e.message+')';DATA=BUILTIN;}
  render();
}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target?.tagName))return;if(state.modal){if(e.key==='Escape')closeSource();return}if(state.page!=='practice')return;if(e.key==='ArrowLeft'){e.preventDefault();prevQ()}if(e.key==='ArrowRight'){e.preventDefault();nextQ()}if(e.key===' '){e.preventDefault();if(!state.review)toggleReveal(state.q)}if(e.key.toLowerCase()==='r'){toggleReview()}});
render();autoLoad();
</script></body></html>
